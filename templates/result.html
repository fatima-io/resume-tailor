{% extends "layout.html" %}

{% block title %}AI Resume Results{% endblock %}

{% block content %}

<div class="container py-5">

    <h1 class="text-center mb-5">
        AI Resume Analysis
    </h1>

    <!-- ATS ANALYSIS -->

    <div class="card shadow-lg mb-5">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                ATS Report
            </h3>

        </div>

        <div class="card-body">

            <pre style="
white-space:pre-wrap;
font-family:Poppins;
font-size:16px;
line-height:1.8;
margin:0;
">{{ analysis }}</pre>

        </div>

    </div>

    <!-- GENERATED RESUME -->

    <div class="card shadow-lg">

        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">

            <h3 class="mb-0">
                AI Optimized Resume
            </h3>

            <button
                class="btn btn-light btn-sm"
                onclick="copyResume()">

                <i class="bi bi-copy"></i>

                Copy Resume

            </button>

        </div>

        <div class="card-body">

            <pre
                id="resumeText"
                style="
white-space:pre-wrap;
font-family:Poppins;
font-size:16px;
line-height:1.8;
margin:0;
">{{ resume }}</pre>

        </div>

    </div>

    <div class="text-center mt-5">

        <button class="btn btn-success btn-lg me-3">

            <i class="bi bi-file-earmark-pdf"></i>

            Download PDF

        </button>

        <button class="btn btn-primary btn-lg">

            <i class="bi bi-file-earmark-word"></i>

            Download DOCX

        </button>

    </div>

    <div class="text-center mt-4">

        <a href="/" class="btn btn-outline-secondary">

            Analyze Another Resume

        </a>

    </div>

</div>

<script>

function copyResume(){

    const text =
        document.getElementById("resumeText").innerText;

    navigator.clipboard.writeText(text);

    alert("Resume copied successfully!");

}

</script>

{% endblock %}
